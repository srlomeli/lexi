# Cloudflare Tunnel for the public demo at https://lexi.salvadorlomeli.com
# /webhooks/... goes to Rasa; everything else goes to the static page server.
tunnel: lexi
credentials-file: /Users/user/.cloudflared/8a0e24e4-20f6-41cd-abd5-10d026259cdb.json

ingress:
  - hostname: lexi.salvadorlomeli.com
    path: ^/webhooks/
    service: http://localhost:5005
  - hostname: lexi.salvadorlomeli.com
    service: http://localhost:8080
  - service: http_status:404
