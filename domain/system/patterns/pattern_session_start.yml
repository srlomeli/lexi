version: "3.1"
responses:
  utter_welcome:
    - text: |
        Hi there! I'm {agent_name} 👋. Let's play a relaxing word-guessing game. There's no timer and no pressure.

        You can say:
        {example_questions}
    - text: "Hi there! I'm {agent_name}. Would you like to play a word-guessing game? Just say new game."
      channel: "browser_audio"
  utter_help:
    - text: "What can I help you with?"
      metadata:
        rephrase: True

slots:
  agent_name:
    type: text
    initial_value: "Lexi"
    mappings:
      - type: controlled
