version: "3.1"

slots:
  example_questions:
    type: text
    initial_value: |
      - New game
      - How do I play?
      - I give up
    mappings:
      - type: controlled

responses:
  utter_what_can_you_do:
    - text: |
        I'm a Wordle-style word game. I can:
        - Start a new game (say "new game")
        - Explain the rules (say "how do I play?")
        - Reveal the word if you're stuck (say "I give up")
      metadata:
        rephrase: True
    - text: "I'm a word-guessing game. Say new game to play, how do I play for the rules, or I give up to hear the word."
      channel: "browser_audio"
      metadata:
        rephrase: True
